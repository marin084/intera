server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Maximum upload size for file/document attachments
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Default referer fallback if client doesn't send one (e.g. mobile Safari privacy mode)
    set $custom_referer $http_referer;
    if ($custom_referer = "") {
        set $custom_referer "$scheme://$http_host/";
    }

    # Security Headers (OWASP Hardening)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend Single Page App (Admin application: protected against clickjacking)
    # The /channels route collides with the public /channels/ icon directory.
    # Route the exact SPA paths to the app before Nginx applies directory redirects.
    location = /channels {
        rewrite ^ /index.html last;
    }

    location = /channels/ {
        rewrite ^ /index.html last;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.html;
    }

    # Webchat Widget HTML (Must be embeddable in authorized external customer iframes)
    location = /widget.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Intentionally NO X-Frame-Options header so customer websites can frame the widget
        try_files /widget.html =404;
    }

    # Webchat Widget Assets (Embeddable in authorized customer iframes)
    location /widget/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Notice: No X-Frame-Options is attached here to allow iframe embedding across client sites
        try_files $uri $uri/ /widget/index.html;
    }
    location /api/ {
        client_max_body_size 25M;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Referer $custom_referer;
    }

    # Proxy public storage media files to backend
    location /storage/ {
        client_max_body_size 25M;
        proxy_pass http://backend:8000/storage/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket to Laravel Reverb
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Proxy Health check requests to backend
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy Sanctum CSRF cookie requests to backend
    location /sanctum/ {
        proxy_pass http://backend:8000/sanctum/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer $custom_referer;
    }
}
